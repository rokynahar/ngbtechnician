<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
<title>NGB ISP Inventory System</title>

<style>
body{
  font-family:'Segoe UI',Arial,sans-serif;
  font-size:20px;margin:0;padding:0;
  display:flex;justify-content:center;
  background:#D177C6;text-align:center;
}
.container{
  width:95%;
  max-width:1400px;
  background:#0988B0;
  padding:20px;
  margin:15px auto;
  border-radius:20px;
  overflow-x:auto;
}

h2{font-size:28px;margin-bottom:20px}
h3{font-size:24px;margin-bottom:15px}
.card{
  background:#3B54D1;border-radius:15px;
  margin-bottom:20px;padding:20px;
  box-shadow:5px 5px 10px #c2cbd7,-5px -5px 10px #fff;
}
button{
  font-size:18px;padding:12px 20px;margin:8px;
  border:none;border-radius:10px;
  font-weight:bold;color:#fff;cursor:pointer;
  transition: all 0.3s ease;
}

/* Edit Button Only */

#stockBody button{
    font-size:11px;
    padding:3px 8px;
    margin:0;
    min-width:auto;
    width:auto;
    min-width:unset;
    line-height:1.2;
}

#stockBody tr:hover{

    background:#EECBF2;

}


button:hover{
  transform: scale(1.05);
  box-shadow: 0 0 12px rgba(79,172,254,0.9);
}

label{display:block;margin:10px 0;font-weight:bold;text-align:left}

/* ===== Form Label Left + Input Right ===== */

.formRow{
    display:flex;
    align-items:center;
    gap:0px;          
}

.formRow label{
    width:55px;      
    margin:0;
    padding-right:2px;
    text-align:left;
    font-weight:bold;
    flex-shrink:0;
}

.formRow input,
.formRow select{
    flex:1;
    margin:0;
}


input,select{
  width:100%;
  padding:12px;
  font-size:16px;
  border:2px solid #444;      /* বর্ডার */
  border-radius:8px;
  margin-bottom:12px;
  background:#fff;
  box-sizing:border-box;
}

/* Scrollable table container */
.table-container{
  overflow-x:auto;
  margin-top:15px;
  -webkit-overflow-scrolling: touch;
}

table{
    width:auto;
    min-width:100%;
    border-collapse:collapse;
    table-layout:auto;
    font-size:13px;
    }


th,
td{
    border:1px solid #ccc;
    padding:3px 6px;
    vertical-align:middle;
    white-space:nowrap;
    }

th{background:#4facfe;color:#fff}
tr:nth-child(even){background:#eef6ff}

#loginSection,#addForm,#stockView,#productForm{display:none}

/* Responsive adjustments for very small screens */
@media(max-width:360px){
  body{font-size:16px}
  h2{font-size:22px}
  h3{font-size:18px}
  button{font-size:14px;padding:10px}
  input,select{font-size:14px;padding:10px}
  table{font-size:12px}
}

/* ===== Stock Table Compact ===== */

table{
    width:auto;
    min-width:100%;
    border-collapse:collapse;
    table-layout:auto;
    font-size:13px;
}

th,
td{
    padding:4px 8px;
    white-space:nowrap;
    vertical-align:middle;
}

th{
    text-align:center;
}

td{
    text-align:center;
}

/* Note Column */
th:nth-child(8),
td:nth-child(8){
    white-space:normal;
    word-break:break-word;
    text-align:left;
    min-width:140px;
    max-width:220px;
}

/* Action */

th:nth-child(10),
td:nth-child(10){

    width:1%;

    padding:2px;

    white-space:nowrap;

}

/* User Column */

th:nth-child(9),
td:nth-child(9){

    min-width:70px;
    max-width:100px;
    text-align:center;
    white-space:nowrap;

}

/* ================= Desktop Only ================= */

@media (min-width:992px){

    /* Login Card */
    #loginSection{
        max-width:420px;
        margin:20px auto;
    }

    /* Add Form */
    #addForm{
        max-width:700px;
        margin:20px auto;
    }

    /* Product Form */
    #productForm{
        max-width:500px;
        margin:20px auto;
    }

    /* Stock Search Area */
    #stockView{
        max-width:1100px;
        margin:20px auto;
    }

    /* Desktop Input & Select */
    #loginSection input,
#loginSection select,
#productForm input,
#productForm select{
    max-width:420px;
    width:100%;
    margin-left:auto;
    margin-right:auto;
    display:block;
}

/* Add Form */
#addForm .formRow{
    display:grid;
    grid-template-columns:110px 1fr;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
}

#addForm .formRow label{
    margin:0;
    text-align:left;
}

#addForm .formRow input,
#addForm .formRow select{
    width:100%;
    max-width:100%;
    margin:0;
    display:block;
}

}

/* Stock View Search Form Center */

#stockView{
    text-align:center;
}

#stockView label{
    text-align:center;
}





/* ================= PRINT A4 ================= */

@media print{

    @page{
        size:A4 portrait;
        margin:8mm;
        label,
    #searchCategory,
    #searchProduct{
    display:none !important;

  }

  #totalINOUT{
    font-size:13px;
    margin:5px 0 8px 0;
    text-align:center;
    font-weight:bold;
}
    }

    body{
        background:#fff;
    }

    .container{
        width:100% !important;
        max-width:100% !important;
        background:#fff !important;
        padding:0;
        margin:0;
        border-radius:0;
        box-shadow:none;
    }

    #mainButtons,
    #loginSection,
    #addForm,
    #productForm,
    button{
        display:none !important;
    }

    #stockView{
        display:block !important;
        background:#fff;
        padding:0;
        box-shadow:none;
    }

    .table-container{
        overflow:visible !important;
    }

    table{
        width:100%;
        min-width:100%;
        font-size:11px;
    }

    th{
        background:#ddd !important;
        color:#000 !important;
    }

    th,
    td{
        border:1px solid #000;
        padding:3px 5px;
        vertical-align:top;
      }

    th:nth-child(8),
    td:nth-child(8){
    text-align:left;
    white-space:normal;
    word-break:break-word;
    }


    h2{
    color:#000;
    text-align:center;
    font-size:20px;
    margin:0;
    padding:0;
}

h3{
    color:#000;
    text-align:center;
    font-size:14px;
    margin:2px 0 8px 0;
    padding:0;
}

.catBlock{
    background:#fff;
    padding:15px;
    margin-bottom:20px;
    border-radius:10px;
}

.products div{
    background:#eef6ff;
    border-radius:8px;
}

/* Print Search Area One Line */

#stockView label{
    display:inline-block !important;
    width:auto;
    margin:0 4px 0 0;
    font-size:11px;
    font-weight:bold;
}

#stockView #searchCategory,
#stockView #searchProduct{
    display:inline-block !important;
    width:180px;
    margin:0 10px 6px 0;
    vertical-align:middle;
    font-size:11px;
}

/* ===== Print Summary ===== */

#summaryBar{

color:#000 !important;

}

#summaryBar span{

color:#000 !important;

font-weight:bold;

}

}



/*================ SUMMARY =================*/

#summaryArea{

display:flex;

gap:8px;

margin:8px 0;

flex-wrap:wrap;

}

.summaryBox{

flex:1;

min-width:300px;

background:#fff;

border-radius:8px;

padding:6px 10px;

box-shadow:0 0 4px rgba(0,0,0,.2);

}

.summaryBox h3{

margin:0 0 5px 0;

font-size:15px;

text-align:center;

}

.summaryRow{

display:flex;

align-items:center;

justify-content:space-between;

font-size:13px;

font-weight:bold;

gap:8px;

}

.summaryValue{

color:green;

font-size:18px;

}

.summaryValueOut{

color:red;

font-size:18px;

}

@media(max-width:700px){

.summaryBox{

min-width:100%;

}

}


/* ===== Search Row ===== */

/* ================= SEARCH ROW ================= */

.searchRow{

display:flex;

align-items:flex-end;

justify-content:center;

gap:8px;

flex-wrap:wrap;

margin:10px 0;

}

.searchRow>div{

display:flex;

flex-direction:column;

}

.searchRow label{

margin-bottom:4px;

font-size:14px;

font-weight:bold;

text-align:center;

}

.searchRow select{

width:220px;
min-width:220px;

}

.btnArea{

display:flex;
justify-content:center;
gap:10px;
margin-top:12px;
flex-wrap:wrap;

}

..btnArea button{
height:38px;
padding:0 18px;
font-size:15px;
margin:0;
}






</style>
</head>

<body>
<div class="container">

<h2>📦 NGB ISP Inventory System</h2>

<div id="mainButtons">
  <button onclick="showLogin('add')" style="background:#4facfe">নতুন এন্ট্রি</button>
  <button onclick="showLogin('stock')" style="background:#43e97b">স্টক ভিউ</button>
  <button onclick="showLogin('product')" style="background:#f5576c">নতুন প্রোডাক্ট</button>
</div>

<!-- LOGIN -->
<div id="loginSection" class="card">
  <h3>🔐 লগইন</h3>
  <label>ইউজার নাম</label><input id="username">
  <label>পাসওয়ার্ড</label><input id="password" type="password">
  <button onclick="login()" style="background:#4facfe">লগইন</button>
  <button onclick="cancelAll()" style="background:#dc3545">❌ বাতিল</button>
  <p id="loginMsg" style="color:red"></p>
</div>

<!-- ADD ITEM -->
<div id="addForm" class="card">
  <h3>নতুন মাল যোগ</h3>
  <div id="categoryContainer"></div>

<button onclick="addCategoryBlock()"
style="background:#2196F3">
➕ Add Category
</button>

<button
id="saveBtn"
onclick="saveAllItems()"
style="background:#43e97b">
💾 Save All
</button>

<button onclick="cancelAll()" style="background:#dc3545">❌ বাতিল</button>
</div>

<!-- STOCK -->
<div id="stockView" class="card">
  <h3>📊 স্টক ভিউ</h3>


<!-- ===== Search Row ===== -->

<div class="searchRow">

    <div>
        <label>User</label>
        <select id="searchUser">
            <option value="">--All User--</option>
        </select>
    </div>

    <div>
        <label>Category</label>
        <select id="searchCategory" onchange="loadProductsForSearch(this.value)"></select>
    </div>

    <div>
        <label>Product</label>
        <select id="searchProduct"></select>
    </div>

</div>

<div class="btnArea">

    <button onclick="loadStock()" style="background:#4facfe">🔍 সার্চ</button>

    <button onclick="printStock()" style="background:#ff9800">🖨 Print</button>

    <button onclick="cancelAll()" style="background:#dc3545">❌ বাতিল</button>

</div>

<!-- ===== End Search Row ===== -->



<!-- ================= SUMMARY START ================= -->

<h3 id="totalINOUT"></h3>
<div id="summaryArea">

<div class="summaryBox">

<div id="summaryBar">

Select User + Category + Product

</div>

</div>

</div>

<!-- ================= SUMMARY END ================= -->

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Date</th><th>Category</th><th>Product</th>
          <th>Qty</th><th>Unit</th><th>Price</th>
          <th>Type</th><th>Note</th><th>User</th>
          <th id="actionHead">Action</th>
        </tr>
      </thead>
      <tbody id="stockBody"></tbody>
    </table>
  </div>
</div>

<!-- PRODUCT -->
<div id="productForm" class="card">
  <h3>নতুন প্রোডাক্ট</h3>
  <label>Category</label><input id="newCategory">
  <label>Product</label><input id="newProduct">
  <button onclick="saveNewProduct()" style="background:#f5576c">💾 সেভ</button>
  <button onclick="cancelAll()" style="background:#dc3545">❌ বাতিল</button>
  <p id="productMsg"></p>
</div>

</div>

<script>
    let allCategories=[];
    let editMode = false;
    let editRow = 0;

const API_URL="https://script.google.com/macros/s/AKfycbxsCdhRRiDNbkRyQmPRXalFX4tvvGWaySs4vt_2biq-lserTDtGXKSTveIcTF-mX_Mybg/exec";

function api(a,d={}){d.action=a;
  return fetch(API_URL,{method:"POST",body:JSON.stringify(d)}).then(r=>r.json());
}

let currentAction="";
let previousPage = "main";
let loginRole = "";

function hideAll(){
 ["mainButtons","loginSection","addForm","stockView","productForm"]
 .forEach(i=>document.getElementById(i).style.display="none");
}


function cancelAll(){

    editMode = false;
    editRow = 0;

    document.getElementById("saveBtn").innerHTML = "💾 Save All";
    categoryContainer.innerHTML = "";

    hideAll();

    if(previousPage=="stock"){

        previousPage="main";

        stockView.style.display="block";

        searchCategory.value = window.lastCategory;

        loadProductsForSearch(window.lastCategory);

        setTimeout(()=>{

            searchProduct.value = window.lastProduct;

            loadStock();

        },300);

    }else{

        document.getElementById("mainButtons").style.display="block";

    }

}



function showLogin(a){
 previousPage = "main";
 currentAction = a;
 hideAll();
 loginSection.style.display = "block";
}

function login(){
 api("login",{username:username.value,password:password.value})
 .then(r=>{
  if(r.status==="success"){
    loginRole = r.role || "";
    localStorage.setItem("loginRole", loginRole);


    localStorage.setItem("loginUser", username.value);
    hideAll();
    if(currentAction==="add"){addForm.style.display="block";loadCategories();}
    if(currentAction==="stock"){stockView.style.display="block";loadUsersForSearch();loadCategoriesForSearch();}
    if(currentAction==="product"){productForm.style.display="block";}
  }else loginMsg.innerText="ভুল ইউজার নাম বা পাসওয়ার্ড";
 });
}

function loadCategories(){

 api("getCategories").then(c=>{

   allCategories = c;

   categoryContainer.innerHTML = "";

   if(categoryContainer.innerHTML==""){
    addCategoryBlock();
}

 });

}

function loadCategoriesForSearch(){
 api("getCategories").then(c=>{
  searchCategory.innerHTML="";
  c.forEach(x=>searchCategory.innerHTML+=`<option>${x}</option>`);
  loadProductsForSearch(searchCategory.value);
 });
}


/* ================= LOAD USERS ================= */

function loadUsersForSearch(){

api("getUsers").then(users=>{

const sel=document.getElementById("searchUser");

sel.innerHTML='<option value="">--All User--</option>';

users.forEach(u=>{

sel.innerHTML += `<option>${u}</option>`;

});

});

}



function loadProductsForSearch(category){

api("getProducts",{category:category})
.then(products=>{

searchProduct.innerHTML =
'<option value="">--All--</option>';

products.forEach(p=>{

searchProduct.innerHTML +=
`<option>${p}</option>`;

});

});

}





function saveAllItems(){

let data=[];

document.querySelectorAll(".catBlock").forEach(cat=>{

let category=cat.querySelector("select").value;

cat.querySelectorAll(".productRow").forEach(p=>{

let product=p.querySelector(".productSelect").value;
let date=p.querySelector(".date")?.value||"";
let qty=p.querySelector(".qty")?.value||"";

if(product=="" || qty=="") return;

data.push({

date:date,
category:category,
name:product,
qty:qty,
price:p.querySelector(".price")?.value||"",
unit:p.querySelector(".unit")?.value||"",
type:p.querySelector(".type")?.value||"",
note:p.querySelector(".note")?.value||""

});

});

});

if(data.length==0){

alert("No Data");

return;

}

/* ---------- EDIT ---------- */

if(editMode){

api("updateStock",{

row:editRow,

user:localStorage.getItem("loginUser"),

data:data[0]

}).then(r=>{

alert(r);

editMode=false;
editRow=0;
document.getElementById("saveBtn").innerHTML="💾 Save All";
categoryContainer.innerHTML="";

hideAll();

stockView.style.display="block";

searchCategory.value=window.lastCategory;

loadProductsForSearch(window.lastCategory);

setTimeout(()=>{

searchProduct.value=window.lastProduct;

loadStock();

},300);

});

return;

}

/* ---------- ADD ---------- */

api("addItems",{

user:localStorage.getItem("loginUser"),

data:data

}).then(r=>{

alert(r);

editMode=false;
editRow=0;
document.getElementById("saveBtn").innerHTML="💾 Save All";
categoryContainer.innerHTML="";

editMode=false;
editRow=0;

addCategoryBlock();

});

}

function addCategoryBlock(){

let html=`

<div class="catBlock">

<select onchange="showProducts(this)">

<option value="">Select Category</option>

${allCategories.map(c=>`<option>${c}</option>`).join("")}

</select>

<div class="products"></div>

</div>

`;

categoryContainer.insertAdjacentHTML("beforeend",html);

}


function showProducts(sel){

const box = sel.parentNode.querySelector(".products");

box.innerHTML = `
<div class="productList"></div>
`;

return addProductRow(
box.querySelector(".productList")
);

}



function addProductRow(list){

let category =
list.closest(".catBlock")
.querySelector("select").value;

return api("getProducts",{
category:category
})
.then(products=>{

let html=`

<div class="productRow" style="margin:15px 0;padding:15px;border:1px solid #ccc;border-radius:10px">

<select class="productSelect" onchange="productChanged(this)">

<option value="">Select Product</option>

${products.map(p=>`<option>${p}</option>`).join("")}

</select>

<div class="productDetails"></div>

</div>

`;

list.innerHTML = html;

});

}


function formatDateInput(str){

if(!str) return "";

let p = str.split("/");

return `${p[2]}-${p[1]}-${p[0]}`;

}



function productChanged(sel){

if(sel.value==""){

sel.parentNode.querySelector(".productDetails").innerHTML="";

return;

}

let d =
sel.parentNode.querySelector(".productDetails");

d.innerHTML=`

<div class="formRow">
<label>Date</label>
<input class="date" type="date">
</div>

<div class="formRow">
<label>Qty</label>
<input class="qty" type="number">
</div>

<div class="formRow">
<label>Unit</label>
<select class="unit">
<option>pcs</option>
<option>meter</option>
</select>
</div>

<div class="formRow">
<label>Price</label>
<input class="price" type="number">
</div>

<div class="formRow">
<label>Type</label>
<select class="type">
<option>IN</option>
<option>OUT</option>
</select>
</div>

<div class="formRow">
<label>Note</label>
<input class="note">
</div>

`;

}



function loadStock(){
document.getElementById("actionHead").style.display =
(localStorage.getItem("loginRole")=="Admin")
? ""
: "none";

const currentCategory = searchCategory.value;
const currentProduct = searchProduct.value;
api("getStock",{
user:searchUser.value,
category:searchCategory.value,
product:searchProduct.value
})
.then(r=>{

const balance=r.totalIN-r.totalOUT;

/* ========= SUMMARY ========= */

document.getElementById("summaryBar").innerHTML=`

<span>👤 ${searchUser.value||"All User"}</span>

<span>📦 ${searchCategory.value||"All Category"}</span>

<span>📄 ${searchProduct.value||"All Product"}</span>

<span style="color:green;">📥 ${r.totalIN}</span>

<span style="color:red;">📤 ${r.totalOUT}</span>

<span style="color:blue;">⚖ ${balance}</span>

`;


totalINOUT.innerText=
`Total IN: ${r.totalIN} | Total OUT: ${r.totalOUT} | Balance: ${balance}`;

stockBody.innerHTML="";

r.rows.forEach(x=>{

let isAdmin = localStorage.getItem("loginRole")=="Admin";
stockBody.innerHTML+=`

<tr>

<td>${x[1]}</td>

<td>${x[2]}</td>

<td>${x[3]}</td>

<td>${x[4]}</td>

<td>${x[5]}</td>

<td>${x[6]}</td>

<td>${x[7]}</td>

<td>${x[8]}</td>

<td>${x[9] || ""}</td>

${isAdmin ? `
<td>
<button
style="background:#2196F3"
onclick="editStock(${x[0]})">
✏ Edit
</button>
</td>
` : ``}

</tr>

`;

});

});

}

function saveNewProduct(){
 api("addProduct",{category:newCategory.value,productName:newProduct.value})
 .then(m=>productMsg.innerText=m);
}

function printStock(){
    window.print();
}

async function editStock(row){

editMode = true;
editRow = row;

window.lastCategory = searchCategory.value;
window.lastProduct = searchProduct.value;

const item = await api("getStockRow",{
    row:row
});

if(!item || !item.row){
    alert("Data Not Found");
    return;
}

hideAll();
previousPage = "stock";
addForm.style.display = "block";

document.getElementById("saveBtn").innerHTML = "💾 Update";

allCategories = await api("getCategories");

await fillEditForm(item);

}



async function fillEditForm(item){

categoryContainer.innerHTML = "";

addCategoryBlock();

const cat = document.querySelector(".catBlock");

const catSelect = cat.querySelector("select");

/* Category */
catSelect.value = item.category;

/* Product List Load */
await showProducts(catSelect);

/* Product */
const product = cat.querySelector(".productSelect");

product.value = item.name;

/* Details Open */
productChanged(product);

/* Form তৈরি হওয়া পর্যন্ত অপেক্ষা */
await new Promise(r => setTimeout(r,50));

/* Fill Data */
cat.querySelector(".date").value = formatDateInput(item.date);
cat.querySelector(".qty").value = item.qty;
cat.querySelector(".unit").value = item.unit;
cat.querySelector(".price").value = item.price;
cat.querySelector(".type").value = item.type;
cat.querySelector(".note").value = item.note;

}




</script>

</body>
</html>
