<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
<title>NGB ISP Inventory System</title>

<style>
body{
  font-family:'Segoe UI',Arial,sans-serif;
  font-size:20px;margin:0;padding:0;
  display:flex;justify-content:center;
  background:#D177C6;text-align:center;
}
.container{
  width:95%;max-width:480px;
  background:#0988B0;padding:20px;
  margin:15px 0;border-radius:20px;
  overflow-x:hidden;
}
h2{font-size:28px;margin-bottom:20px}
h3{font-size:24px;margin-bottom:15px}
.card{
  background:#3B54D1;border-radius:15px;
  margin-bottom:20px;padding:20px;
  box-shadow:5px 5px 10px #c2cbd7,-5px -5px 10px #fff;
}
button{
  font-size:18px;padding:12px 20px;margin:8px;
  border:none;border-radius:10px;
  font-weight:bold;color:#fff;cursor:pointer;
  transition: all 0.3s ease;
}
button:hover{
  transform: scale(1.05);
  box-shadow: 0 0 12px rgba(79,172,254,0.9);
}

label{display:block;margin:10px 0;font-weight:bold;text-align:left}
input,select{
  width:100%;padding:12px;font-size:16px;
  border:none;border-radius:8px;margin-bottom:12px;
  background:#f2f6fa;
  box-shadow:inset 3px 3px 6px #c2cbd7,
             inset -3px -3px 6px #fff;
}

/* Scrollable table container */
.table-container{
  overflow-x:auto;
  margin-top:15px;
  -webkit-overflow-scrolling: touch;
}

table{
  width:100%;border-collapse:collapse;
  font-size:14px;
  word-wrap: break-word;
}
th,td{border:1px solid #ccc;padding:8px;white-space:nowrap}
th{background:#4facfe;color:#fff}
tr:nth-child(even){background:#eef6ff}

#loginSection,#addForm,#stockView,#productForm{display:none}

/* Responsive adjustments for very small screens */
@media(max-width:360px){
  body{font-size:16px}
  h2{font-size:22px}
  h3{font-size:18px}
  button{font-size:14px;padding:10px}
  input,select{font-size:14px;padding:10px}
  table{font-size:12px}
}
</style>
</head>

<body>
<div class="container">

<h2>📦 NGB ISP Inventory System</h2>

<div id="mainButtons">
  <button onclick="showLogin('add')" style="background:#4facfe">নতুন এন্ট্রি</button>
  <button onclick="showLogin('stock')" style="background:#43e97b">স্টক ভিউ</button>
  <button onclick="showLogin('product')" style="background:#f5576c">নতুন প্রোডাক্ট</button>
</div>

<!-- LOGIN -->
<div id="loginSection" class="card">
  <h3>🔐 লগইন</h3>
  <label>ইউজার নাম</label><input id="username">
  <label>পাসওয়ার্ড</label><input id="password" type="password">
  <button onclick="login()" style="background:#4facfe">লগইন</button>
  <button onclick="cancelAll()" style="background:#dc3545">❌ বাতিল</button>
  <p id="loginMsg" style="color:red"></p>
</div>

<!-- ADD ITEM -->
<div id="addForm" class="card">
  <h3>নতুন মাল যোগ</h3>
  <label>Category</label>
  <select id="category" onchange="loadProducts(this.value)"></select>
  <label>Product</label>
  <select id="productName"></select>
  <label>Qty</label><input id="qty" type="number">
  <label>Unit</label>
  <select id="unit"><option>pcs</option><option>meter</option></select>
  <label>Price</label><input id="price" type="number">
  <label>Type</label>
  <select id="type"><option>IN</option><option>OUT</option></select>
  <label>Note</label><input id="note">
  <button onclick="saveItem()" style="background:#43e97b">💾 সেভ</button>
  <button onclick="cancelAll()" style="background:#dc3545">❌ বাতিল</button>
</div>

<!-- STOCK -->
<div id="stockView" class="card">
  <h3>📊 স্টক ভিউ</h3>
  <label>Category</label>
  <select id="searchCategory" onchange="loadProductsForSearch(this.value)"></select>
  <label>Product</label>
  <select id="searchProduct"></select>
  <button onclick="loadStock()" style="background:#4facfe">🔍 সার্চ</button>
  <button onclick="cancelAll()" style="background:#dc3545">❌ বাতিল</button>

  <h3 id="totalINOUT"></h3>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Date</th><th>Category</th><th>Product</th>
          <th>Qty</th><th>Unit</th><th>Price</th>
          <th>Type</th><th>Note</th>
        </tr>
      </thead>
      <tbody id="stockBody"></tbody>
    </table>
  </div>
</div>

<!-- PRODUCT -->
<div id="productForm" class="card">
  <h3>নতুন প্রোডাক্ট</h3>
  <label>Category</label><input id="newCategory">
  <label>Product</label><input id="newProduct">
  <button onclick="saveNewProduct()" style="background:#f5576c">💾 সেভ</button>
  <button onclick="cancelAll()" style="background:#dc3545">❌ বাতিল</button>
  <p id="productMsg"></p>
</div>

</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbwhG9CrZQ4qRLtWUdvwqw3og-D2k7O_xu1iPAh49853kvVFoSmsVLMrl7ChEzClbrqsng/exec";

function api(a,d={}){d.action=a;
  return fetch(API_URL,{method:"POST",body:JSON.stringify(d)}).then(r=>r.json());
}

let currentAction="";

function hideAll(){
 ["mainButtons","loginSection","addForm","stockView","productForm"]
 .forEach(i=>document.getElementById(i).style.display="none");
}
function cancelAll(){
 hideAll();
 document.getElementById("mainButtons").style.display="block";
}

function showLogin(a){
 currentAction=a;hideAll();
 loginSection.style.display="block";
}

function login(){
 api("login",{username:username.value,password:password.value})
 .then(r=>{
  if(r.status==="success"){
    hideAll();
    if(currentAction==="add"){addForm.style.display="block";loadCategories();}
    if(currentAction==="stock"){stockView.style.display="block";loadCategoriesForSearch();}
    if(currentAction==="product"){productForm.style.display="block";}
  }else loginMsg.innerText="ভুল ইউজার নাম বা পাসওয়ার্ড";
 });
}

function loadCategories(){
 api("getCategories").then(c=>{
  category.innerHTML="";
  c.forEach(x=>category.innerHTML+=`<option>${x}</option>`);
  loadProducts(category.value);
 });
}
function loadProducts(c){
 api("getProducts",{category:c}).then(p=>{
  productName.innerHTML="";
  p.forEach(x=>productName.innerHTML+=`<option>${x}</option>`);
 });
}
function loadCategoriesForSearch(){
 api("getCategories").then(c=>{
  searchCategory.innerHTML="";
  c.forEach(x=>searchCategory.innerHTML+=`<option>${x}</option>`);
  loadProductsForSearch(searchCategory.value);
 });
}
function loadProductsForSearch(c){
 api("getProducts",{category:c}).then(p=>{
  searchProduct.innerHTML='<option value="">--All--</option>';
  p.forEach(x=>searchProduct.innerHTML+=`<option>${x}</option>`);
 });
}

function saveItem(){
 api("addItem",{data:{
  category:category.value,name:productName.value,
  qty:qty.value,unit:unit.value,
  price:price.value,type:type.value,note:note.value
 }}).then(m=>{
   alert(m);

   // ফর্ম ফাঁকা করা
   qty.value = '';
   price.value = '';
   note.value = '';
   unit.selectedIndex = 0;
   type.selectedIndex = 0;
   category.selectedIndex = 0;
   loadProducts(category.value);
 });
}

function loadStock(){
 api("getStock",{category:searchCategory.value,product:searchProduct.value})
 .then(r=>{
  const balance = r.totalIN - r.totalOUT;
  totalINOUT.innerText=`Total IN: ${r.totalIN} | Total OUT: ${r.totalOUT} | Balance: ${balance}`;

  stockBody.innerHTML="";
  r.rows.forEach(x=>{
   stockBody.innerHTML+=`<tr>
    <td>${new Date(x[0]).toLocaleDateString()}</td>
    <td>${x[1]}</td><td>${x[2]}</td>
    <td>${x[3]}</td><td>${x[4]}</td>
    <td>${x[5]}</td><td>${x[6]}</td><td>${x[7]}</td>
   </tr>`;
  });
 });
}

function saveNewProduct(){
 api("addProduct",{category:newCategory.value,productName:newProduct.value})
 .then(m=>productMsg.innerText=m);
}
</script>

</body>
</html>
