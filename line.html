<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>System</title>

<style>
	
/* MOBILE VERSION */

@media screen and (max-width:768px){

#loginBox{
width:95%;
}

#form{
width:95%;
left:50%;
transform:translateX(-50%);
}

/* SEARCH SECTION ONE LINE */
.searchBox{
display:flex;
flex-wrap:nowrap;
overflow-x:auto;
gap:5px;
align-items:center;
}

.searchBox input,
.searchBox button{
width:auto;
flex:0 0 auto;
}

table{
font-size:11px;
display:block;
overflow-x:auto;
white-space:nowrap;
}

/* BUTTONS ALSO ONE LINE */
.topSection div{
overflow-x:auto;
white-space:nowrap;
}

.topSection button{
width:auto;
margin-bottom:0;
flex:0 0 auto;
}

}
/* PC VERSION */

@media screen and (min-width:769px){

#main{
max-width:1400px;
}

#loginBox{
width:300px;
}

#form{
width:400px;
}

.searchBox{
flex-direction:row;
}

table{
font-size:14px;
}

.topSection button{
width:auto;
margin-bottom:0;
}

}
body{
margin:0;
font-family:Arial;
background:#f2f6ff;
display:flex;
justify-content:flex-start;
align-items:center;
flex-direction:column;
min-height:100vh;
padding-top:20px;
}

#loginBox{
width:250px;
background:#fff;
padding:10px;
border-radius:10px;
text-align:center;
box-shadow:0 0 10px #0002;
}

input,select{
padding:7px;
margin:3px;
box-sizing:border-box;
}

.small{
width:50px;
font-size:12px;
}

button{
padding:4px 8px;
font-size:12px;
border:none;
border-radius:5px;
cursor:pointer;
margin:2px;
}

.blue{background:#007bff;color:#fff}
.green{background:#28a745;color:#fff}
.red{background:#dc3545;color:#fff}
.orange{background:#ff9800;color:#fff}

#main{
display:none;
padding:10px;
width:95%;
text-align:center;
}

#form{
display:none;
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
background:#fff;
padding:15px;
width:280px;
border-radius:10px;
box-shadow:0 0 10px #0003;
z-index:999;
text-align:left;
}

.form-group{
margin-bottom:8px;
}

label{
font-size:13px;
font-weight:bold;
display:block;
margin-bottom:2px;
}

.form-control{
width:100%;
}

table{
width:100%;
border-collapse:collapse;
background:#fff;
margin-top:10px;
font-size:13px;
}

th{
background:#007bff;
color:#fff;
padding:6px;
}

td{
border:1px solid #ddd;
padding:5px;
text-align:center;
}

.searchBox{
display:flex;
flex-wrap:wrap;
gap:5px;
justify-content:center;
align-items:center;
}

#searchText{
width:160px;
}

#fromDate,
#toDate{
width:120px;
}

#searchMonth{
width:120px;
}

#searchYear{
width:70px;
}

.searchBox button{
width:auto;
}

/* PRINT */

@media print{

body *{
visibility:hidden;
}

#printTable,
#printTable *{
visibility:visible;
}

#printTable{
position:absolute;
left:0;
top:0;
width:100%;
}

.topSection{
display:none;
}

}

</style>
</head>

<body>

<div id="loginBox">

<center> 
<h3>আপনার ইউজার নাম ও পাসওয়ার্ড দিন</h3>
</center>

<input id="username" placeholder="User" style="width:100%">

<input id="password" type="password" placeholder="Pass" style="width:100%">

<button class="blue" onclick="login()">Login</button>

</div>

<div id="main">

<div class="topSection">

<!-- FIRST LINE -->

<div style="margin-bottom:8px;">

<button class="green" onclick="newApplication()">নতুন লাইন যোগ</button>

<button class="red" onclick="logout()">Logout</button>

</div>

<!-- SECOND LINE -->

<div class="searchBox" style="margin-bottom:8px;">

<input id="searchText" class="small" placeholder="নাম / মোবাইল">

<input type="date" id="fromDate" class="small">

<input type="date" id="toDate" class="small">

<input type="month" id="searchMonth" class="small">

<input type="number" id="searchYear" class="small" placeholder="বছর">

<button class="blue" onclick="searchData()">Search</button>

<button class="red" onclick="cancelSearch()">Cancel</button>

</div>

<!-- THIRD LINE -->

<div style="margin-bottom:10px;">

<button class="green" onclick="window.print()">Print</button>

<button class="red" onclick="cancelPrint()">Cancel</button>

</div>

</div>

<table id="printTable">

<thead>

<tr>

<th>নাম</th>
<th>পিতা</th>
<th>ঠিকানা</th>
<th>মোবাইল</th>
<th>সংযোগ</th>
<th>ইউজার</th>
<th>তারিখ</th>
<th>Action</th>

</tr>

</thead>

<tbody id="tb"></tbody>

</table>

</div>

<div id="form">

<div class="form-group">
<label>নাম</label>
<input id="name" class="form-control">
</div>

<div class="form-group">
<label>পিতার নাম</label>
<input id="father" class="form-control">
</div>

<div class="form-group">
<label>ঠিকানা</label>
<input id="address" class="form-control">
</div>

<div class="form-group">
<label>মোবাইল নম্বর</label>
<input id="mobile" class="form-control">
</div>

<div class="form-group">
<label>সংযোগ টাইপ</label>

<select id="type" class="form-control">

<option>ডিস</option>
<option>ইন্টারনেট</option>
<option>সার্ভিস</option>

</select>
</div>

<button class="green" onclick="save()">Save</button>

<button class="red" onclick="closeForm()">Cancel</button>

</div>

<script>

const API="https://script.google.com/macros/s/AKfycbxq7qlefWipRrwIHy4aJiolFmg0YNKg9P44fqUG2AhwGwGa0yDWE0pGAo281rwkARmW4A/exec";

let currentUser="";
let currentRole="";
let allData=[];
let editIndex=-1;

/* LOGIN */

function login(){

fetch(API,{
method:"POST",
body:JSON.stringify({
action:"login",
username:username.value,
password:password.value
})
})

.then(r=>r.json())

.then(res=>{

if(res.success){

currentUser=res.username;
currentRole=res.role;

loginBox.style.display="none";
main.style.display="block";

load();

}
else{

alert("Login Failed");

}

});

}

/* LOGOUT */

function logout(){

currentUser="";
currentRole="";

main.style.display="none";
loginBox.style.display="block";

}

/* SAVE */

function save(){

fetch(API,{
method:"POST",
body:JSON.stringify({
action:"save",
username:currentUser,
name:document.getElementById("name").value,
fatherName:document.getElementById("father").value,
address:document.getElementById("address").value,
mobile:document.getElementById("mobile").value,
connectionType:document.getElementById("type").value,
editIndex:editIndex
})
})

.then(r=>r.json())

.then(res=>{

if(res.success){

closeForm();
load();

}
else{

alert("Save Failed");

}

});

}

/* LOAD */

function load(){

fetch(API,{
method:"POST",
body:JSON.stringify({action:"get"})
})

.then(r=>r.json())

.then(data=>{

allData=data;

render(data);

});

}

/* RENDER */

function render(data){

tb.innerHTML="";

data.forEach((d,i)=>{

tb.innerHTML+=`

<tr>

<td>${d.name}</td>
<td>${d.fatherName}</td>
<td>${d.address}</td>
<td>${d.mobile}</td>
<td>${d.connectionType}</td>
<td>${d.username}</td>
<td>${new Date(d.dateTime).toLocaleString()}</td>

<td>

${currentRole=="admin"
? `<button class="orange" onclick="editData(${i})">Edit</button>`
: ""}

</td>

</tr>

`;

});

}

/* SEARCH */

function searchData(){

let txt=searchText.value.toLowerCase();

let fromDate=document.getElementById("fromDate").value;
let toDate=document.getElementById("toDate").value;
let month=document.getElementById("searchMonth").value;
let year=document.getElementById("searchYear").value;

let filtered=allData.filter(d=>{

let dt=new Date(d.dateTime);

let ok=true;

if(txt){

ok=
d.name.toLowerCase().includes(txt)
||
d.mobile.includes(txt);

}

if(fromDate){

ok=ok && dt >= new Date(fromDate);

}

if(toDate){

ok=ok && dt <= new Date(toDate+"T23:59:59");

}

if(month){

let m=dt.toISOString().slice(0,7);

ok=ok && m==month;

}

if(year){

ok=ok && dt.getFullYear()==year;

}

return ok;

});

render(filtered);

}

/* CANCEL SEARCH */

function cancelSearch(){

searchText.value="";
fromDate.value="";
toDate.value="";
searchMonth.value="";
searchYear.value="";

render(allData);

}

/* PRINT CANCEL */

function cancelPrint(){

alert("Print Cancel");

}

/* NEW APPLICATION */

function newApplication(){

clearForm();

editIndex=-1;

openForm();

}

/* EDIT */

function editData(i){

let d=allData[i];

document.getElementById("name").value=d.name || "";
document.getElementById("father").value=d.fatherName || "";
document.getElementById("address").value=d.address || "";
document.getElementById("mobile").value=d.mobile || "";
document.getElementById("type").value=d.connectionType || "ডিস";

editIndex=d.rowIndex;

openForm(false);

}

/* FORM */

function openForm(clear=true){

if(clear){

clearForm();

}

form.style.display="block";

}

/* CLOSE FORM */

function closeForm(){

form.style.display="none";

clearForm();

editIndex=-1;

}

/* CLEAR FORM */

function clearForm(){

document.getElementById("name").value="";
document.getElementById("father").value="";
document.getElementById("address").value="";
document.getElementById("mobile").value="";
document.getElementById("type").selectedIndex=0;

}

/* AUTO LOAD */

load();

</script>

</body>
</html>
