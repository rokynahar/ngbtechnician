<!DOCTYPE html> 
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NGB কেবল নেটওয়ার্ক টিজে তথ্যঃ</title>
<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f7f7f7;
    text-align:center;
    padding:20px;
}
h1,h3,label{
    text-align:center;
    width:100%;
    display:block;
    margin:5px 0;
}
#tree ul{
    list-style:none;
    padding:0;
    margin:0 auto;
    text-align:center;
}
.box{
    cursor:pointer;
    padding:25px 30px;
    margin:15px auto;
    background:#4fc3f7;
    border-radius:15px;
    display:inline-block;
    min-width:280px;
    font-size:28px;
    position:relative;
    text-align:center;
    color:white;
    transition:0.3s;
    box-shadow:0 4px 8px rgba(0,0,0,0.2);
}
.box:hover{
    background:#29b6f6;
    transform:scale(1.05);
}
.actions{
    margin-top:15px;
    text-align:center;
}
.actions button{
    margin:5px;
    font-size:20px;
    padding:10px 25px;
    border-radius:8px;
    cursor:pointer;
    transition:0.2s;
}
.actions button:hover{
    background:#0288d1;
    color:white;
}
.modal{
    display:none;
    position:fixed;
    top:5%;
    left:50%;
    transform:translateX(-50%);
    padding:20px;
    background:white;
    border:1px solid #333;
    z-index:1000;
    width:90%;
    max-width:600px;
    max-height:90%;
    overflow-y:auto;
    text-align:center;
    border-radius:12px;
    box-shadow:0 8px 16px rgba(0,0,0,0.3);
}
.modal input{
    width:100%;
    padding:12px;
    margin:6px 0;
    font-size:18px;
    text-align:center;
    border-radius:6px;
    border:1px solid #ccc;
    box-sizing:border-box;
}
.modalBtn{
    font-size:18px;
    padding:10px 25px;
    margin:5px;
    cursor:pointer;
    border-radius:8px;
    background:#4fc3f7;
    border:none;
    color:white;
    transition:0.3s;
}
.modalBtn:hover{
    background:#0288d1;
}
#searchResult div{
    padding:12px;
    border-bottom:1px solid #ccc;
    cursor:pointer;
    font-size:20px;
    text-align:center;
}
#searchResult div:hover{
    background:#e0f7fa;
}
@media screen and (max-width:750px){
    .box{font-size:22px;padding:18px; min-width:90%;}
    .actions button,.modalBtn{font-size:16px;padding:8px 18px;}
    .modal input{font-size:16px;}
}
</style>
</head>
<body>

<h1>NGB কেবল নেটওয়ার্ক টিজে তথ্যঃ</h1>
<button class="modalBtn" onclick="openSearchModal()">🔍 TJ Box খুঁজুন</button>
<div id="tree"></div>

<!-- Box Detail Modal -->
<div id="modal" class="modal">
<h3 id="modalTitle"></h3>

<!-- নতুন লোকেশন বাটন -->
<div style="margin-bottom:15px;">
    <button class="modalBtn" onclick="saveLocation()">📍 Save Location</button>
    <button class="modalBtn" id="openMapBtn" onclick="openGoogleMap()">🌐 Open in Google Maps</button>
</div>

<label>টিজের অবস্থানঃ</label><input id="boxLabel" readonly>
<label>টিজের দূরত্বঃ</label><input id="boxDistance" type="number" readonly>
<label>মেন লাইন ও কাষ্টমার লেজারঃ</label><input id="boxLineType" readonly>
<label>কালার ম্যাপঃ</label><input id="boxColorMap" readonly>
<label>Fiber Code:</label><input id="fiberCode" readonly>
<label>Fiber Color:</label><input id="fiberColor" readonly>
<label>Customer Name:</label><input id="customerName" readonly>
<label>Customer ID:</label><input id="customerId" readonly>
<label>Customer Fiber Code:</label><input id="customerFiberCode" readonly>
<label>Customer Fiber Color:</label><input id="customerFiberColor" readonly>
<label>PLC:</label><input id="Plc" readonly>

<div class="actions">
<button class="modalBtn" onclick="requestLogin('edit',null)">✏️ Edit</button>
<button class="modalBtn" onclick="closeModal()">Close</button>
<button class="modalBtn" id="saveBtn" onclick="savebox()" style="display:none;">💾 Save</button>
</div>
</div>

<!-- Add New Box Modal -->
<div id="addModal" class="modal">
<h3>নতুন TJ Box যুক্ত করুন</h3>
<label>টিজের অবস্থানঃ</label><input id="addLabel">
<label>টিজের দূরত্বঃ</label><input id="addDistance" type="number">
<label>মেন লাইন ও কাষ্টমার লেজারঃ</label><input id="addLineType">
<label>কালার ম্যাপঃ</label><input id="addColorMap">
<label>Fiber Code:</label><input id="addFiberCode">
<label>Fiber Color:</label><input id="addFiberColor">
<label>Customer Name:</label><input id="addCustomerName">
<label>Customer ID:</label><input id="addCustomerId">
<label>Customer Fiber Code:</label><input id="addCustomerFiberCode">
<label>Customer Fiber Color:</label><input id="addCustomerFiberColor">
<label>PLC:</label><input id="addPlc">
<div class="actions">
<button class="modalBtn" onclick="saveNewbox()">💾 Save</button>
<button class="modalBtn" onclick="closeAddModal()">Cancel</button>
</div>
</div>

<!-- Login Modal -->
<div id="loginModal" class="modal">
<h3>লগইন</h3>
<input id="loginUser" placeholder="Username">
<input id="loginPass" type="password" placeholder="Password">
<button class="modalBtn" onclick="verifyLogin()">লগইন</button>
<button class="modalBtn" onclick="closeLogin()">Cancel</button>
<p id="loginMsg" style="color:red;"></p>
</div>

<!-- Search Modal -->
<div id="searchModal" class="modal">
<h3>Search TJ Box</h3>
<input id="searchInput" placeholder="Enter TJ Box label">
<button class="modalBtn" onclick="searchbox()">Search</button>
<button class="modalBtn" onclick="closeSearchModal()">Close</button>
<div id="searchResult"></div>
</div>

<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbwi4brKLmvAivCYVwjhgikeEF5Bc3n57yp_FID3M4GnGaMbMDr-4meXp8l7wi5i3z1O8Q/exec";

let treeData=null;
let selectedbox=null;
let loggedUser=null;
let pendingAction=null;

// ডিফল্ট লোকেশন
let LAT=24.823709;
let LNG=88.326462;

// ----------------- Location Feature -----------------
function saveLocation() {
  if(!selectedbox) return alert('প্রথমে একটি টিজ নির্বাচন করুন।');
  const data = {
    action: 'save_location',
    boxId: selectedbox.id,
    lat: LAT,
    lng: LNG,
    user: loggedUser || 'guest'
  };
  fetch(SCRIPT_URL, {
    method: 'POST',
    body: JSON.stringify(data)
  })
  .then(res => res.json())
  .then(res => {
    if(res.success){
      alert('লোকেশন সেভ হয়েছে!');
      selectedbox.latitude = LAT;
      selectedbox.longitude = LNG;
      updateMapButton();
    }
    else alert('সেভ করার সময় সমস্যা হয়েছে: ' + (res.message||''));
  })
  .catch(err => alert('Error: '+err));
}

function openGoogleMap() {
  if(!selectedbox || !selectedbox.latitude || !selectedbox.longitude){
    alert('এই বক্সে কোনো লোকেশন নেই।');
    return;
  }
  const url = `https://www.google.com/maps/search/?api=1&query=${selectedbox.latitude},${selectedbox.longitude}`;
  window.open(url, '_blank');
}

function updateMapButton(){
  const openBtn = document.getElementById('openMapBtn');
  if(selectedbox && selectedbox.latitude && selectedbox.longitude){
    openBtn.disabled = false;
    openBtn.style.opacity = 1;
  } else {
    openBtn.disabled = true;
    openBtn.style.opacity = 0.5;
  }
}

// ----------------- আগের সব JS ফাংশন -----------------
function renderTree(box,container){
  const li=document.createElement('li');
  const div=document.createElement('div');
  div.className='box';
  div.innerHTML=`${box.label} (${box.distance}m)`;
  const actions=document.createElement('div');
  actions.className='actions';
  actions.innerHTML=`<button onclick="requestLogin('edit',this)">✏️</button>
                     <button onclick="requestLogin('add',this)">➕</button>`;
  div.appendChild(actions);
  li.appendChild(div);
  const ul=document.createElement('ul');
  if(box.children) box.children.forEach(child=>renderTree(child,ul));
  li.appendChild(ul);
  container.appendChild(li);
  div.addEventListener('click',()=>{ selectedbox=box; showboxDetails(box); });
}

function showboxDetails(box){
  document.getElementById('modal').style.display='block';
  document.getElementById('modalTitle').textContent=box.label;
  document.getElementById('boxLabel').value=box.label||'';
  document.getElementById('boxDistance').value=box.distance||'';
  document.getElementById('boxLineType').value=box.lineType||'';
  document.getElementById('boxColorMap').value=box.colorMap||'';
  document.getElementById('fiberCode').value=box.fiberCode||'';
  document.getElementById('fiberColor').value=box.fiberColor||'';
  document.getElementById('customerName').value=box.customerName||'';
  document.getElementById('customerId').value=box.customerId||'';
  document.getElementById('customerFiberCode').value=box.customerFiberCode||'';
  document.getElementById('customerFiberColor').value=box.customerFiberColor||'';
  document.getElementById('Plc').value=box.Plc||'';
  document.getElementById('saveBtn').style.display='none';
  Array.from(document.querySelectorAll('#modal input')).forEach(el=>el.setAttribute('readonly',true));

  updateMapButton();
}



function renderTree(box,container){
  const li=document.createElement('li');
  const div=document.createElement('div');
  div.className='box';
  div.innerHTML=`${box.label} (${box.distance}m)`;
  const actions=document.createElement('div');
  actions.className='actions';
  actions.innerHTML=`<button onclick="requestLogin('edit',this)">✏️</button>
                     <button onclick="requestLogin('add',this)">➕</button>`;
  div.appendChild(actions);
  li.appendChild(div);
  const ul=document.createElement('ul');
  if(box.children) box.children.forEach(child=>renderTree(child,ul));
  li.appendChild(ul);
  container.appendChild(li);
  div.addEventListener('click',()=>{ selectedbox=box; showboxDetails(box); });
}

function showboxDetails(box){
  document.getElementById('modal').style.display='block';
  document.getElementById('modalTitle').textContent=box.label;
  document.getElementById('boxLabel').value=box.label||'';
  document.getElementById('boxDistance').value=box.distance||'';
  document.getElementById('boxLineType').value=box.lineType||'';
  document.getElementById('boxColorMap').value=box.colorMap||'';
  document.getElementById('fiberCode').value=box.fiberCode||'';
  document.getElementById('fiberColor').value=box.fiberColor||'';
  document.getElementById('customerName').value=box.customerName||'';
  document.getElementById('customerId').value=box.customerId||'';
  document.getElementById('customerFiberCode').value=box.customerFiberCode||'';
  document.getElementById('customerFiberColor').value=box.customerFiberColor||'';
  document.getElementById('Plc').value=box.Plc||'';
  document.getElementById('saveBtn').style.display='none';
  Array.from(document.querySelectorAll('#modal input')).forEach(el=>el.setAttribute('readonly',true));
}

function closeModal(){document.getElementById('modal').style.display='none';}
function openAddModal(){document.getElementById('addModal').style.display='block';}
function closeAddModal(){document.getElementById('addModal').style.display='none';}
function openLogin(){document.getElementById('loginModal').style.display='block';}
function closeLogin(){document.getElementById('loginModal').style.display='none';document.getElementById('loginMsg').innerText='';}
function openSearchModal(){document.getElementById('searchModal').style.display='block';document.getElementById('searchInput').value='';document.getElementById('searchResult').innerHTML='';}
function closeSearchModal(){document.getElementById('searchModal').style.display='none';}

// Login & actions
function requestLogin(action,btn){ pendingAction=action; if(btn) selectedbox=getboxFromElement(btn); if(!loggedUser) openLogin(); else executeAction();}
function verifyLogin(){
  const u=document.getElementById('loginUser').value.trim();
  const p=document.getElementById('loginPass').value.trim();
  fetch(SCRIPT_URL,{method:'POST',body: JSON.stringify({action:'login',username:u,password:p})})
  .then(res=>res.json()).then(res=>{
    if(res.success){loggedUser=res.user; closeLogin(); executeAction();}
    else document.getElementById('loginMsg').innerText='ভুল ইউজারনেম বা পাসওয়ার্ড!';
  });
}
function executeAction(){if(pendingAction==='edit') enableEditing(); if(pendingAction==='add') openAddModal();}
function enableEditing(){Array.from(document.querySelectorAll('#modal input')).forEach(el=>el.removeAttribute('readonly'));document.getElementById('saveBtn').style.display='inline-block';}

// Save/Insert
function savebox(){
  selectedbox.label=document.getElementById('boxLabel').value;
  selectedbox.distance=Number(document.getElementById('boxDistance').value);
  selectedbox.lineType=document.getElementById('boxLineType').value;
  selectedbox.colorMap=document.getElementById('boxColorMap').value;
  selectedbox.fiberCode=document.getElementById('fiberCode').value;
  selectedbox.fiberColor=document.getElementById('fiberColor').value;
  selectedbox.customerName=document.getElementById('customerName').value;
  selectedbox.customerId=document.getElementById('customerId').value;
  selectedbox.customerFiberCode=document.getElementById('customerFiberCode').value;
  selectedbox.customerFiberColor=document.getElementById('customerFiberColor').value;
  selectedbox.Plc=document.getElementById('Plc').value;
  fetch(SCRIPT_URL,{method:'POST',body: JSON.stringify({action:'update',box:selectedbox,user:loggedUser})}).then(()=>loadFromSheet());
  closeModal();
}
function saveNewbox(){
  const label=document.getElementById('addLabel').value.trim();
  if(!label) return alert('টিজের নাম দিন!');
  const newbox={id:'id-'+Math.random().toString(36).substr(2,9), parentId:selectedbox.id, label,
    distance:Number(document.getElementById('addDistance').value)||0, lineType:document.getElementById('addLineType').value,
    colorMap:document.getElementById('addColorMap').value, fiberCode:document.getElementById('addFiberCode').value,
    fiberColor:document.getElementById('addFiberColor').value, customerName:document.getElementById('addCustomerName').value,
    customerId:document.getElementById('addCustomerId').value, customerFiberCode:document.getElementById('addCustomerFiberCode').value,
    customerFiberColor:document.getElementById('addCustomerFiberColor').value, Plc:document.getElementById('addPlc').value
  };
  fetch(SCRIPT_URL,{method:'POST',body: JSON.stringify({action:'insert',box:newbox,user:loggedUser})}).then(()=>loadFromSheet());
  closeAddModal();
}

// Search
function searchbox(){
  const term=document.getElementById('searchInput').value.trim().toLowerCase();
  if(!term) return alert('TJ Box নাম লিখুন।');
  const results=[];
  function search(n){ if(n.label.toLowerCase().includes(term)) results.push(n); if(n.children)n.children.forEach(search);}
  search(treeData);
  const div=document.getElementById('searchResult'); div.innerHTML='';
  if(results.length===0){ div.innerHTML='<p>কোনো ফলাফল নেই।</p>'; return;}
  results.forEach(box=>{const d=document.createElement('div'); d.textContent=`${box.label} (${box.distance}m)`; d.onclick=()=>{closeSearchModal(); selectedbox=box; showboxDetails(box);}; div.appendChild(d);});
}

function getboxFromElement(el){while(el&&!el.classList.contains('box'))el=el.parentNode; if(!el)return null; const labelText=el.childNodes[0].textContent.trim(); function search(n,label){if(n.label===label)return n; if(n.children) for(let c of n.children){let r=search(c,label); if(r)return r;} return null;} return search(treeData,labelText);}
function loadFromSheet(){fetch(SCRIPT_URL).then(res=>res.json()).then(data=>{treeData=data; const container=document.getElementById('tree'); container.innerHTML=''; const ul=document.createElement('ul'); renderTree(treeData,ul); container.appendChild(ul);});}

window.onload=loadFromSheet;
</script>
</body>
</html>
