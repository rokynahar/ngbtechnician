<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Links</title>

<style>
  body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    align-items: center;
  }

  h1 {
    color: white;
    font-size: 26px;
    margin: 20px 0;
  }

  .grid {
    width: 100%;
    max-width: 500px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 15px;
    padding: 0 15px;
    flex: 1;
  }

  /* 🌟 Stylish Buttons */
  button {
    width: 100%;
    padding: 22px;
    font-size: 20px;
    border: none;
    border-radius: 18px;
    color: white;
    cursor: pointer;
    font-weight: bold;
    letter-spacing: 0.5px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.25);
    transition: 0.25s;
  }

  button:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 22px rgba(0,0,0,0.35);
  }

  button:active {
    transform: scale(0.97);
  }

  /* 🎨 Gradient Buttons */
  .b1 { background: linear-gradient(45deg, #ff416c, #ff4b2b); }
  .b2 { background: linear-gradient(45deg, #1dd1a1, #10ac84); }
  .b3 { background: linear-gradient(45deg, #1e90ff, #3742fa); }
  .b4 { background: linear-gradient(45deg, #ffa502, #ff6348); }
  .b5 { background: linear-gradient(45deg, #a55eea, #8854d0); }
  .b6 { background: linear-gradient(45deg, #00d2d3, #01a3a4); }

  /* 📱 Desktop */
  @media (min-width: 700px) {
    .grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  /* 🔻 Footer */
  footer {
    width: 100%;
    text-align: center;
    padding: 15px;
    background: rgba(0,0,0,0.25);
    color: white;
    font-size: 14px;
    backdrop-filter: blur(10px);
  }
</style>
</head>

<body>
<center>
<h1>🌈 NGB হিসাব</h1>
</center>

<div class="grid">

  <button class="b1" onclick="openLink('worker.html')">কর্মীর হাজিরা হিসাব</button>
  <button class="b2" onclick="openLink('working.html')">প্রতিদিনের আয়/ব্যঢ হিসাব</button>
  <button class="b3" onclick="openLink('product users.html')">প্রডাক্টস ব্যবহার</button>
  <button class="b6" onclick="openLink('line.html')">ডিস লািইনে তালিকা</button>
  <button class="b3" onclick="openLink('stok.html')">ষ্টক হিসাব</button>

  

</div>

<footer>
  🚀 Power By Roky ❤️ NGB Personal Link Page ❤️
</footer>

<script>
  function openLink(url) {
    window.open(url, "_blank");
  }
</script>

</body>
</html>
