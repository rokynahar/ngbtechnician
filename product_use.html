<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISP SYSTEM</title>

<style>

/* =========================
BASE STYLE
========================= */

body{
margin:0;
font-family:Arial;
background:#eef3f9;
text-align:center;
}

/* =========================
LOGIN
========================= */

#loginBox{padding-top:30px;}

.loginCard{
max-width:320px;
margin:auto;
background:#fff;
padding:15px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

/* =========================
DASHBOARD
========================= */

#dash{
display:none;
padding:10px;
}

/* =========================
FORM GRID
========================= */

.formGrid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:10px;
margin-top:10px;
}

.formItem{
text-align:left;
background:#f7fafc;
padding:5px;
border-radius:8px;
}

/* =========================
INPUTS
========================= */

label{
font-size:12px;
font-weight:bold;
display:block;
margin-bottom:4px;
}

input,select{
width:100%;
padding:3px 5px;
font-size:10px;
height:26px;
border:1px solid #ccc;
border-radius:5px;
text-align:center;
}

/* =========================
BUTTONS
========================= */

button{
padding:7px 12px;
border:none;
border-radius:6px;
cursor:pointer;
font-size:12px;
color:#fff;
}

.save{background:green}
.search{background:#009688}
.cancel{background:red}
.print{background:#333}
.edit{background:orange}
.logout{background:#444}

/* =========================
SEARCH SECTION
========================= */

.searchWrap{
display:flex;
justify-content:center;
gap:5px;
flex-wrap:wrap;
margin:5px 0 10px 0;
}

.searchWrap input{
padding:5px;
font-size:11px;
width:140px;
}

.searchWrap button{
padding:5px 8px;
font-size:11px;
}

/* =========================
TABLE
========================= */

.tableWrap{
width:100%;
overflow-x:auto;
-webkit-overflow-scrolling:touch;
}

table{
width:100%;
min-width:800px;
border-collapse:collapse;
margin-top:10px;
}

th,td{
border:1px solid #ddd;
padding:6px;
font-size:12px;
text-align:center;
}

th{
background:#222;
color:#fff;
}

/* =========================
POPUP
========================= */

.popup{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.5);
overflow-y:auto;
z-index:9999;
}

.popupBox{
background:#fff;
width:90%;
max-width:400px;
margin:30px auto;
padding:15px;
border-radius:12px;
max-height:90vh;
overflow-y:auto;
}

.popupBox input,
.popupBox select{
width:100%;
margin:5px 0;
padding:7px;
}

/* =========================
MOBILE RESPONSIVE
========================= */

@media (max-width:600px){

body{
font-size:14px;
}

.searchWrap{
flex-direction:column;
align-items:center;
}

.searchWrap input,
.searchWrap button{
width:95%;
max-width:350px;
}

button{
font-size:13px;
padding:10px;
}

.popupBox{
width:95%;
margin:15px auto;
}

.formGrid{
grid-template-columns:1fr;
}

th,td{
font-size:11px;
white-space:nowrap;
}

}

</style>
</head>

<body>

<!-- =========================
LOGIN SECTION
========================= -->

<div id="loginBox">
<div class="loginCard">
<h3>LOGIN</h3>
<input id="u" placeholder="Username"><br><br>
<input id="p" type="password" placeholder="Password"><br><br>
<button class="save" onclick="login()">LOGIN</button>
</div>
</div>

<!-- =========================
DASHBOARD SECTION
========================= -->

<div id="dash">

<button class="logout" onclick="location.reload()">LOGOUT</button>
<br><br>

<button class="save" onclick="formPopup.style.display='block'">
প্রডাক্টস ব্যবহার যুক্ত করুন
</button>

<br><br>

<!-- =========================
ADD CUSTOMER POPUP
========================= -->

<div id="formPopup" class="popup">
<div class="popupBox">

<h3>ADD সংযোগ হিসাব</h3>

<div class="formGrid">

<div class="formItem">
<label>তারিখ</label>
<input type="date" id="date">
</div>

<div class="formItem">
<label>কাষ্টমার নাম</label>
<input id="name" placeholder="Enter customer name">
</div>

<div class="formItem">
<label>ইউজার আইডি/সিরিয়াল</label>
<input id="uid" placeholder="Enter user ID">
</div>

<div class="formItem">
<label>ফাইবার/আজি ৬</label>
<input id="cable" placeholder="Enter cable meter">
</div>

<div class="formItem">
<label>টিজের ধরণ</label>
<select id="tj"></select>
</div>

<div class="formItem">
<label>পিএসসি ব্যবহার</label>
<select id="plc"></select>
</div>

<div class="formItem">
<label>প্যাচ কড ব্যবহার </label>
<select id="patch"></select>
</div>

</div>

<br>

<button class="save" onclick="save()">SAVE</button>
<button class="cancel" onclick="formPopup.style.display='none'">CLOSE</button>

</div>
</div>

<!-- =========================
SEARCH SECTION
========================= -->

<div class="searchWrap">

<input id="search" placeholder="Search" oninput="filterTable()">
<input id="from" type="date" oninput="filterTable()">
<input id="to" type="date" oninput="filterTable()">

<button class="search" onclick="filterTable()">SEARCH</button>
<button class="cancel" onclick="clearSearch()">CLEAR</button>
<button class="print" onclick="printTable()">PRINT</button>

</div>

<!-- =========================
TABLE SECTION
========================= -->

<div class="tableWrap">

<table>
<thead>
<tr>
<th>Date</th>
<th>Name</th>
<th>User ID/SN</th>
<th>Cable Meter</th>
<th>TJ</th>
<th>PLC</th>
<th>Patch Code</th>
<th>Editor</th>
<th>Edit</th>
</tr>
</thead>

<tbody id="tb"></tbody>
</table>

</div>

<!-- =========================
EDIT POPUP
========================= -->

<div id="popup" class="popup">
<div class="popupBox">

<h3>Edit Data</h3>

<input type="date" id="e_date">
<input id="e_name">
<input id="e_uid">
<input id="e_cable">
<select id="e_tj"></select>
<select id="e_plc"></select>
<select id="e_patch"></select>

<button class="save" onclick="updateRow()">UPDATE</button>
<button class="cancel" onclick="popup.style.display='none'">CLOSE</button>

</div>
</div>

</div>

<!-- =========================
SCRIPT SECTION
========================= -->

<script>

const API="https://script.google.com/macros/s/AKfycbzk1IGgsiwCSpyORyTw2y807dDRRtjonfw3dlEtNTZk06xqlpWlfjd_j-9Q5ShMUvpFhg/exec";

let user="", role="", editRowId=0;

/* LOGIN */
function login(){
fetch(API,{
method:"POST",
body:new URLSearchParams({
action:"login",
username:u.value,
password:p.value
})
})
.then(r=>r.json())
.then(res=>{
if(res.status){
user=res.user;
role=res.role;
loginBox.style.display="none";
dash.style.display="block";
loadProducts();
load();
}
});
}

/* PRODUCTS */
function loadProducts(){
fetch(API,{
method:"POST",
body:new URLSearchParams({action:"products"})
})
.then(r=>r.json())
.then(d=>{

tj.innerHTML =
`<option value="" selected disabled>Select TJ</option>` +
d.tj.map(x=>`<option value="${x}">${x}</option>`).join("");

plc.innerHTML =
`<option value="" selected disabled>Select PLC</option>` +
d.plc.map(x=>`<option value="${x}">${x}</option>`).join("");

patch.innerHTML =
`<option value="" selected disabled>Select Patch</option>` +
d.patch.map(x=>`<option value="${x}">${x}</option>`).join("");

tj.value="";
plc.value="";
patch.value="";

e_tj.innerHTML=tj.innerHTML;
e_plc.innerHTML=plc.innerHTML;
e_patch.innerHTML=patch.innerHTML;

});
}

/* SAVE */
function save(){
fetch(API,{
method:"POST",
body:new URLSearchParams({
action:"add",
date:document.getElementById("date").value,
name:document.getElementById("name").value,
userId:document.getElementById("uid").value,
cable:document.getElementById("cable").value,
tj:document.getElementById("tj").value,
plc:document.getElementById("plc").value,
patch:document.getElementById("patch").value,
user:user
})
})
.then(()=>{
document.getElementById("date").value="";
document.getElementById("name").value="";
document.getElementById("uid").value="";
document.getElementById("cable").value="";

formPopup.style.display="none";
load();

});
}

/* LOAD */
function load(){
fetch(API)
.then(r=>r.json())
.then(data=>{

let html="";

for(let i=1;i<data.length;i++){
let r=data[i];
let rowIndex=i+1;

html+=`
<tr>
<td>${r[0]}</td>
<td>${r[1]}</td>
<td>${r[2]}</td>
<td>${r[3]}</td>
<td>${r[4]}</td>
<td>${r[5]}</td>
<td>${r[6]}</td>
<td>${r[7]}</td>

<td>
${role==="admin"
? `<button class="edit" onclick="openEdit(${rowIndex},'${r[0]}','${r[1]}','${r[2]}','${r[3]}','${r[4]}','${r[5]}','${r[6]}')">Edit</button>`
:""}
</td>

</tr>`;
}

tb.innerHTML=html;
filterTable();

});
}

/* EDIT */
function openEdit(row,date,name,id,cable,tjVal,plcVal,patchVal){

editRowId=row;

e_date.value=date;
e_name.value=name;
e_uid.value=id;
e_cable.value=cable;

e_tj.value=tjVal;
e_plc.value=plcVal;
e_patch.value=patchVal;

popup.style.display="block";
}

/* UPDATE */
function updateRow(){
fetch(API,{
method:"POST",
body:new URLSearchParams({
action:"edit",
row:editRowId,
date:e_date.value,
name:e_name.value,
userId:e_uid.value,
cable:e_cable.value,
tj:e_tj.value,
plc:e_plc.value,
patch:e_patch.value,
user:user
})
})
.then(()=>{

popup.style.display="none";
load();

});
}

/* PRINT */
function printTable(){

let w=window.open("");

let table=document.querySelector("table").cloneNode(true);

for(let r of table.rows){
r.deleteCell(-1);
}

w.document.write(`
<html>
<head>
<title>Print</title>

<style>
body{font-family:Arial;padding:20px;}
table{width:100%;border-collapse:collapse;}
th,td{border:1px solid #000;padding:8px;text-align:center;}
th{background:#ddd;}
</style>

</head>
<body>
${table.outerHTML}
</body>
</html>
`);

w.document.close();
w.print();

}

/* CLEAR */
function clearSearch(){
search.value="";
from.value="";
to.value="";
filterTable();
}

/* DATE */
function parseDateSafe(str){
if(!str) return null;
return new Date(str);
}

/* FILTER */
function filterTable(){

let keyword=search.value.toLowerCase().trim();
let fromDate=from.value?new Date(from.value+"T00:00:00"):null;
let toDate=to.value?new Date(to.value+"T23:59:59"):null;

let rows=tb.getElementsByTagName("tr");

for(let i=0;i<rows.length;i++){

let cells=rows[i].getElementsByTagName("td");
if(cells.length===0) continue;

let text=rows[i].innerText.toLowerCase();
let rowDate=parseDateSafe(cells[0].innerText.trim());

let textMatch=text.includes(keyword);

let dateMatch = true;
if (rowDate) {
  if (fromDate && toDate) {
    dateMatch = rowDate >= fromDate && rowDate <= toDate;
  } else if (fromDate) {
    dateMatch = rowDate.toDateString() === fromDate.toDateString();
  } else if (toDate) {
    dateMatch = rowDate.toDateString() === toDate.toDateString();
  }
}

rows[i].style.display=(textMatch && dateMatch)?"":"none";
}
}

</script>

</body>
</html>
